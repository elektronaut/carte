[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/elektronaut/carte"

[workspace.dependencies]
carte-core = { path = "crates/carte-core" }
carte-api = { path = "crates/carte-api" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "ioctl", "poll", "process", "signal", "socket", "term"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
bytes = "1"
futures-util = "0.3"
gethostname = "1.1"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
time = "0.3"
tower-service = "0.3"
lru = "0.18"
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
