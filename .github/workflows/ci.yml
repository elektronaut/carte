name: CI
on:
  push:
    branches:
      - main
  pull_request:
# A new push to a pull request cancels its run in progress. Pushes to main
# queue instead, and release.yml finishes any release from whichever run
# reaches the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Linux runs the whole suite, though `carte setup` is macOS-only for now.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-nextest@0.9.146
      # Each test runs in its own process; .config/nextest.toml fails one
      # that runs for three minutes, and the rest still run.
      - run: cargo nextest run --workspace --locked --profile ci

  # The `rust-version` in Cargo.toml, which `cargo install` checks.
  msrv:
    name: Build on the MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Read rust-version
        run: echo "MSRV=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  # A new advisory shouldn't fail unrelated pull requests, so the advisories
  # check reports without failing the run.
  deny:
    name: Dependencies (${{ matrix.checks }})
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check ${{ matrix.checks }}

  automerge:
    name: Auto-merge Dependabot
    needs: [fmt, test, msrv, deny]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
